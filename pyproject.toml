[project]
name = "hyde-hygo-benchmark-suite"
version = "0.1.0"
description = "Desktop benchmarking suite for the HyDE/HyGO algorithm family (pytauri app)"
requires-python = ">=3.9"
dependencies = [
    "pytauri==0.8.*",
    "pydantic==2.*",
    "anyio==4.*",
    "pydantic-settings>=2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-docx>=1.1",
    "matplotlib>=3.8",
    "zstandard>=0.22",
]

[project.entry-points.pytauri]
ext_mod = "suite.ext_mod"

[build-system]
requires = ["setuptools >= 80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["src/hyde_bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
