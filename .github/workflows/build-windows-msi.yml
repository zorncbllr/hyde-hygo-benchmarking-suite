name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-windows-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msi:
    name: Build Windows MSI installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PBS_TAG: "20260901"
      PBS_ASSET: "cpython-3.13.15+20260901-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
      PBS_SHA256SUMS_URL: "https://github.com/astral-sh/python-build-standalone/releases/download/20260901/SHA256SUMS"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Fetch portable Python
        env:
          PBS_URL: "https://github.com/astral-sh/python-build-standalone/releases/download/${{ env.PBS_TAG }}/${{ env.PBS_ASSET }}"
        run: |
          curl.exe -fL "$env:PBS_URL" -o "$env:RUNNER_TEMP/pbs.tar.gz"
          curl.exe -fL "$env:PBS_SHA256SUMS_URL" -o "$env:RUNNER_TEMP/SHA256SUMS"
          $expected = (Get-Content "$env:RUNNER_TEMP/SHA256SUMS" |
            Where-Object { $_ -like "*$env:PBS_ASSET*" }).Split(" ")[0]
          $actual = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/pbs.tar.gz").Hash.ToLower()
          if ($expected -ne $actual) {
            throw "python-build-standalone SHA256 mismatch: expected $expected, got $actual"
          }
          New-Item -ItemType Directory -Force -Path "src-tauri/pyembed" | Out-Null
          tar -xzf "$env:RUNNER_TEMP/pbs.tar.gz" -C "src-tauri/pyembed"
          if (-not (Test-Path "src-tauri/pyembed/python/python.exe")) {
            throw "Embedded python.exe not found after extraction"
          }

      - name: Strip unused Tcl/Tk from embedded Python
        run: |
          $py = "src-tauri/pyembed/python"
          foreach ($p in @("$py/Lib/tkinter", "$py/Lib/turtledemo", "$py/tcl", "$py/tcl9")) {
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          foreach ($p in @("$py/DLLs/_tkinter.pyd", "$py/DLLs/turtle.pyd")) {
            if (Test-Path $p) { Remove-Item -Force $p -ErrorAction SilentlyContinue }
          }

      - name: Install Python project into embedded interpreter
        env:
          PYTAURI_STANDALONE: "1"
        run: |
          uv pip install `
            --python "src-tauri/pyembed/python/python.exe" `
            --no-cache `
            --reinstall-package=hyde-hygo-benchmark-suite `
            .

      - name: Build MSI bundle
        env:
          PYO3_PYTHON: ${{ github.workspace }}\src-tauri\pyembed\python\python.exe
        run: |
          $env:PATH = "${{ github.workspace }}\ui\node_modules\.bin;$env:PATH"
          tauri build --config src-tauri/tauri.bundle.json --bundles msi -- --profile bundle-release

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchsuite-windows-msi
          path: src-tauri/target/bundle-release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach MSI to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/bundle-release/bundle/msi/*.msi
